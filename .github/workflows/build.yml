# Tests on macOS + Windows, builds the desktop app for Windows, Apple-silicon and Intel Macs, and on a
# version tag (v*) publishes them as a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PIXSIFT_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "backend[dev]"
      # The face/picture-type tests need the ML models (~195 MB); cache them between runs.
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ hashFiles('backend/pixsift/models.py') }}
      - name: Download models (verified by SHA-256)
        run: python -c "from pathlib import Path; from pixsift.models import ModelStore; ModelStore(Path('.models')).ensure()"
      - run: python -m pytest -q backend

  build:
    name: Build (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: PixSift-windows }
          - { os: macos-15, artifact: PixSift-mac-arm64 }
          - { os: macos-15-intel, artifact: PixSift-mac-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Build UI
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Install engine
        run: python -m pip install -e "backend[desktop,build]"
      - name: Build app
        run: |
          python packaging/make_icon.py
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/pixsift.spec

      - name: Self-test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/PixSift.app/Contents/MacOS/PixSift --self-test
          ditto -c -k --keepParent dist/PixSift.app "${{ matrix.artifact }}.zip"
      - name: Self-test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PixSift\PixSift.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          Compress-Archive -Path dist\PixSift -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --title "PixSift ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md
